<script>
'use strict';
const STORAGE_KEY='hre4m1-living-mission-v2';
const STAGES=[{id:'start',name:'Get started',mins:'1 min'},{id:'recall',name:'The three offices',mins:'2 min'},{id:'prophet',name:'Case 1 · Prophet',mins:'6 min'},{id:'priest',name:'Case 2 · Priest',mins:'6 min'},{id:'king',name:'Case 3 · King',mins:'6 min'},{id:'integrate',name:'The three together',mins:'3 min'},{id:'ready',name:'Prepare to share',mins:'1 min'}];
const OFFICE_NAMES={prophet:'Prophet',priest:'Priest',king:'King'};
const OFFICE_BLURBS={prophet:'Speaks and witnesses to God’s truth with courage and charity.',priest:'Offers prayer, worship, and self-giving love, joining life to Christ.',king:'Uses responsibility and influence to serve others with justice and love.'};
const CASES={
prophet:{num:'01',role:'Prophet',tag:'Truth under pressure',title:'The ten-second video',blurb:'What does it mean to speak truth without turning someone into a target?',intro:[
'It is Monday after school. A ten-second clip from Friday’s assembly rehearsal is spreading through the Grade 12 group chat. Lina is shown laughing while another student speaks into a microphone. The caption says Lina was making fun of the student’s accent. People are already posting cruel comments about her.',
'You were at the rehearsal. There was a loud microphone squeal just before Lina laughed, and several other students laughed too. You do not know exactly what Lina was thinking, but the caption leaves out important context. The clip has no sound.'
],chat:[{who:'Grade 12 chat · 4:08 p.m.',text:'Everyone needs to repost this. If you stay silent, you’re defending her.'}],twist:'Lina has not responded publicly. A friend tells you, “If you question the post, everyone will think you support what she did.” You have incomplete information, but you know the current claim is being shared as a fact.',choices:[
{title:'Correct the group publicly and forcefully',detail:'Post that the video is a lie, call out the students reposting it, and demand apologies.',benefit:'You refuse to be silent when someone’s reputation is being harmed.',blind:'Calling it a lie goes beyond what you actually know. Public shaming can create another target.',ask:'How can you be courageous while remaining accurate?'},
{title:'Interrupt the rumour and seek the truth',detail:'Ask people not to repost, explain the missing context, check on Lina, and involve a trusted adult if harassment continues.',benefit:'You speak up while distinguishing what you witnessed from what you cannot know.',blind:'It may be uncomfortable, and some classmates may accuse you of taking sides.',ask:'What could you say that is firm without being hostile?'},
{title:'Deal with it privately',detail:'Message the friend who posted the clip, explain what you saw, and ask them to remove it without commenting publicly.',benefit:'Private correction can preserve relationships and avoid an online pile-on.',blind:'The wider group may keep spreading the misleading caption while you wait.',ask:'When is a private correction enough, and when does public harm call for a public response?'}
],questions:[
{label:'Read the situation',prompt:'What makes this situation morally difficult? Identify one fact you know, one thing you do not know, and whose dignity is at stake.',hint:'Try this structure: “I know ___. I cannot know ___. This matters because ___.”'},
{label:'Connect to Christ',prompt:'Explain how Jesus’ prophetic office should shape the way you respond. How are truth, courage, and love all involved?',hint:'A prophet is not simply someone who predicts events or wins arguments. Think about Jesus proclaiming truth and protecting dignity (Luke 4:18).'},
{label:'Make it real',prompt:'Write one or two sentences you could actually send or say. Explain one risk or cost of that response.',hint:'Use words a real student might say. Be specific about misinformation without claiming to read someone’s intentions.'}
],verse:'“The Spirit of the Lord is upon me, because he has anointed me to bring good news to the poor.”',verseRef:'Luke 4:18',otherRef:'Matthew 5:44',otherText:'Jesus also teaches his followers to love enemies and pray for persecutors.',distinction:'Prophetic witness is truthful and charitable. It is not gossip, certainty without evidence, or attacking people in the name of being right.'},
priest:{num:'02',role:'Priest',tag:'Presence over quick fixes',title:'The promise at midnight',blurb:'What can prayer and self-giving love look like without trying to fix another person’s life?',intro:[
'It is Sunday night. Your friend Jordan has been working long hours after school while also helping care for a younger sibling. Lately Jordan is often exhausted, has missed assignments, and has stopped sitting with your group at lunch.',
'You have an important test tomorrow morning. You care about Jordan, but you also know you cannot solve the family situation or become available at every hour. You have not heard anything suggesting immediate danger.'
],chat:[{who:'Jordan · 11:43 p.m.',text:'I am so behind. Everyone thinks I am lazy. I don’t want to explain my life to anyone. Can you just pray for me? Please don’t make it a big thing.'}],twist:'Jordan sends one more message: “Promise you won’t tell anyone.” You want to honour your friend’s trust. You also wonder whether someone at school could help, especially if the exhaustion and missed work continue.',choices:[
{title:'Pray and let the matter rest',detail:'Promise to pray tonight, send encouragement, and leave Jordan alone unless asked for more.',benefit:'You respect the direct request for prayer and do not pressure Jordan to disclose private matters.',blind:'Jordan may need practical help and human presence in addition to prayer.',ask:'What small follow-up could turn concern into steady care?'},
{title:'Take the whole burden on yourself',detail:'Stay awake as long as Jordan needs and offer to complete the overdue schoolwork.',benefit:'You are willing to sacrifice convenience and demonstrate that Jordan is not alone.',blind:'Doing schoolwork for someone is dishonest; being the only source of support can harm both of you.',ask:'How can self-giving love include healthy boundaries and truthful help?'},
{title:'Offer prayer, presence, and appropriate support',detail:'Ask whether Jordan wants a short conversation or prayer, check in tomorrow, and offer to accompany Jordan to a trusted school adult if willing.',benefit:'You connect prayer to practical love, respect Jordan’s voice, and recognize your limits.',blind:'Jordan may initially refuse help. You may need patience rather than a quick resolution.',ask:'How would you respond if your friend said “not yet” to meeting an adult?'}
],questions:[
{label:'Read the situation',prompt:'What does Jordan need besides a solution to missing work? What limits should a good friend respect?',hint:'Think of dignity, listening, privacy, boundaries, and support. You are not expected to become a counsellor.'},
{label:'Connect to Christ',prompt:'How does sharing in Christ’s priestly office apply here? Connect prayer or offering yourself in service to Jesus’ example.',hint:'Jesus prays for others (John 17:9) and offers himself in love. Baptized Christians share in his priestly mission without becoming ordained priests.'},
{label:'Make it real',prompt:'Write a caring reply to Jordan that includes both a genuine spiritual response and one practical next step.',hint:'Avoid fixing everything or saying “Just pray harder.” You might ask permission, offer accompaniment, and reassure without making an unsafe promise.'}
],verse:'“I am asking on their behalf…”',verseRef:'John 17:9',otherRef:'Luke 22:19',otherText:'At the Last Supper, Jesus gives himself for others and calls them to remember his self-gift.',distinction:'The common priesthood of the baptized means prayer, worship, and offering life to God. It is distinct from the ordained priesthood and does not mean administering sacraments.'},
king:{num:'03',role:'King',tag:'Influence as service',title:'The last two places',blurb:'When you have a voice in a decision, whose good should guide your leadership?',intro:[
'You are on the Grade 12 committee organizing a school showcase. There are twelve performance spots, and only two remain. The committee must make a recommendation tonight. A popular band made up of your friends applied on time and would likely draw a crowd.',
'A quieter group submitted a spoken-word piece one day late. They had been asking about stage accessibility and available equipment before applying. Their piece is strong and gives a perspective that has rarely been represented at school events. Your technical team says the schedule is tight, and there may be enough setup time for only one full-band performance.'
],chat:[{who:'A committee member · 3:12 p.m.',text:'Pick the acts with the most followers. It will fill the seats.'},{who:'Your friend from the band · 3:18 p.m.',text:'We helped you get elected. You’ve got our back, right?'}],twist:'The faculty adviser asks the committee for two selections and a clear explanation of the process. You cannot promise extra time or equipment without checking. Your recommendation may disappoint someone you know.',choices:[
{title:'Make popularity the deciding factor',detail:'Use social-media votes to fill the remaining spots and defend the outcome as democratic.',benefit:'Voting can seem straightforward and may help increase attendance.',blind:'Popularity is not the same as fairness. Students without large networks may never get a genuine opportunity.',ask:'Who may be left out when the crowd makes every decision?'},
{title:'Lead a transparent, inclusive process',detail:'Recommend criteria balancing quality, representation, access, and realistic equipment needs; involve the committee and adviser, and explain the outcome.',benefit:'You use influence to serve the whole community rather than to reward allies.',blind:'No decision will satisfy everyone. You must communicate respectfully and take responsibility.',ask:'How would you explain an unpopular decision without making anyone feel disposable?'},
{title:'Promise everybody a place',detail:'Tell both groups they are in and plan to extend the schedule before asking about approval and technical limits.',benefit:'Your intention is generous and you do not want anyone excluded.',blind:'Promises without authority or planning can hurt performers and volunteers when they cannot be kept.',ask:'Why are stewardship and honesty part of servant leadership?'}
],questions:[
{label:'Read the situation',prompt:'Identify two groups with legitimate interests. What would be unfair about choosing solely to please your friends?',hint:'Consider event quality, accessibility, students with fewer connections, time and resources, and trust in the committee.'},
{label:'Connect to Christ',prompt:'What does the kingship of Jesus teach about using responsibility, power, or influence here? Connect your explanation to his example of service.',hint:'Jesus washes feet (John 13:14–15). His authority is shown by service, not by making others feel small.'},
{label:'Make it real',prompt:'Describe the decision-making process you would recommend, then write one sentence you could say to someone disappointed by the result.',hint:'A fair process needs clear criteria, listening, honest limits, and respect even when the answer is no.'}
],verse:'“For the Son of Man came not to be served but to serve…”',verseRef:'Mark 10:45',otherRef:'John 13:14–15',otherText:'Jesus washes his disciples’ feet and tells them to serve one another.',distinction:'Sharing Christ’s kingly office means responsibility, justice, and service. It is not control, status, or winning every argument.'}
};
const RECALL=[
{id:'r1',ref:'Luke 22:19',quote:'“This is my body, which is given for you. Do this in remembrance of me.”',role:'priest',why:'Jesus gives himself in sacrificial love. His self-offering is at the heart of his priestly mission.'},
{id:'r2',ref:'Luke 4:18',quote:'“The Spirit of the Lord is upon me, because he has anointed me to bring good news to the poor.”',role:'prophet',why:'Jesus proclaims God’s truth and good news, especially to those in need.'},
{id:'r3',ref:'John 13:14–15',quote:'“If I, your Lord and Teacher, have washed your feet, you also ought to wash one another’s feet.”',role:'king',why:'Jesus reveals what his kingship looks like: he leads by humbly serving others.'}
];
const ICONS={
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',back:'<path d="M20 12H4m7 7-7-7 7-7"/>',check:'<path d="m5 12 4 4L19 6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H5a1 1 0 0 0-1 1v11h4"/>',print:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',
people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3"/><circle cx="17" cy="9" r="2"/><path d="M18 13a5 5 0 0 1 3 5v2"/>',person:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
shield:'<path d="M12 2 4 5v6c0 6 3 9 8 11 5-2 8-5 8-11V5z"/><path d="m8 12 3 3 5-6"/>',
prophet:'<path d="M5 6v12a2 2 0 0 0 2 2h11V4H7a2 2 0 0 0-2 2zM9 8h6m-6 4h6m-6 4h3"/><path d="M18 4a2 2 0 0 1 2 2v12"/>',
priest:'<path d="M12 2v13m-5-8h10"/><path d="M4 17c2.5-1.5 5-1.5 8 0 3-1.5 5.5-1.5 8 0v3c-3-1-5-1-8 1-3-2-5-2-8-1z"/>',
king:'<path d="M3 7 7 11 12 4l5 7 4-4-2 13H5z"/><path d="M5 17h14"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>',

heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
refresh:'<path d="M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.4 6.4L3 16m0 5v-5h5"/>',

const icon=(id,extra='')=>`<svg ${extra} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id]||ICONS.info}</svg>`;
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function initial(){return {v:2,step:0,maxStep:0,mode:'solo',name:'',partner:'',period:'',startedAt:null,recall:{},revealed:{},choice:{},answers:{},final:{prophet:'',priest:'',king:'',challenge:'',why:''},discussionCase:'prophet',discussionNote:''};}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s?.v===2&&Number.isInteger(s.step)&&s.step>=0&&s.step<STAGES.length){return {...initial(),...s,recall:s.recall||{},revealed:s.revealed||{},choice:s.choice||{},answers:s.answers||{},final:{...initial().final,...s.final}};}}catch(_){}return initial();}
let state=load();let toastTimer=null;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));const el=document.getElementById('save-status');if(el)el.textContent='Saved locally';}catch(e){const el=document.getElementById('save-status');if(el)el.textContent='Save unavailable';}}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function elapsed(){if(!state.startedAt)return 0;return Math.max(0,Math.floor((Date.now()-state.startedAt)/1000));}
function tick(){const e=elapsed(),m=String(Math.floor(e/60)).padStart(2,'0'),s=String(e%60).padStart(2,'0');document.getElementById('clock').innerHTML=`${icon('clock')} <span>${state.startedAt?`${m}:${s}`:'~25 min'}</span>`;}
const stageHead=(i)=>`<div class="stage-top"><span class="stage-n">${i===0?'WELCOME':'STAGE '+String(i).padStart(2,'0')+' / 06'}</span><span class="time-est">${icon('clock')} ${STAGES[i].mins}</span></div>`;
function navSide(){return `<aside class="side" aria-label="Activity navigation"><div class="side-label">Your journey</div><nav class="step-list" aria-label="Activity stages">${STAGES.map((st,i)=>`<button class="step ${i===state.step?'current':i<state.maxStep?'done':''}" data-go="${i}" ${i>state.maxStep?'disabled':''} ${i===state.step?'aria-current="step"':''}><span class="num">${i<state.maxStep?icon('check'):i+1}</span><span>${esc(st.name)}</span></button>`).join('')}</nav><div class="side-notes"><strong>How this works</strong><p>Read each situation, reveal the complication, make a decision, and explain your reasoning. Your choices are not scored.</p></div></aside>`;}
function navButtons(prev,nextText='Continue',caption='Your responses save as you type.'){
return `<div class="nav-actions"><button class="button secondary" ${state.step===0?'disabled':''} data-back>${icon('back')} Back</button><div><span class="nav-caption">${esc(caption)}</span><button class="button primary" data-next>${esc(nextText)} ${icon('arrow')}</button></div></div>`;
}
function modeButton(mode,label,id){return `<button type="button" class="mode ${state.mode===mode?'selected':''}" data-mode="${mode}" aria-pressed="${state.mode===mode}"><span>${icon(id)} ${label}</span>${state.mode===mode?icon('check'):''}</button>`;}
function startPage(){return `${stageHead(0)}<div class="hero"><div class="hero-content"><div class="eyebrow">The faith you live beyond the classroom</div><h1>Three offices.<br>Real decisions.</h1><p class="intro-copy">You know Jesus as Priest, Prophet, and King. Now put those ideas to work in situations a Grade 12 student might actually face.</p></div><div class="hero-art" aria-hidden="true"><div class="orbit"><div class="orbit-center">${icon('shield','style="width:35px;height:35px"')}</div><div class="orbit-tag pr">${icon('priest')} Priest</div><div class="orbit-tag ph">${icon('prophet')} Prophet</div><div class="orbit-tag kg">${icon('king')} King</div></div></div></div>
<div class="intro-summary"><div class="office-mini prophet"><div class="office-icon">${icon('prophet')}</div><strong>Prophet</strong><p>Speak truth with courage and love.</p></div><div class="office-mini priest"><div class="office-icon">${icon('priest')}</div><strong>Priest</strong><p>Pray for others and offer yourself in service.</p></div><div class="office-mini king"><div class="office-icon">${icon('king')}</div><strong>King</strong><p>Lead with justice, humility, and care.</p></div></div>
<div class="card setup"><h3>Set up your activity</h3><p>Work independently or with one partner. Both people should contribute to the written answers.</p><div class="mode-pick">${modeButton('solo','On my own','person')}${modeButton('pair','With a partner','people')}</div><div class="fields"><div class="field"><label for="student-name">Your name <span class="optional">(optional, for export)</span></label><input id="student-name" type="text" data-field="name" autocomplete="off" maxlength="70" placeholder="First and last name" value="${esc(state.name)}"></div>${state.mode==='pair'?`<div class="field"><label for="partner-name">Partner name <span class="optional">(optional)</span></label><input id="partner-name" type="text" data-field="partner" autocomplete="off" maxlength="70" placeholder="Partner's name" value="${esc(state.partner)}"></div>`:''}<div class="field"><label for="period">Class period <span class="optional">(optional)</span></label><select id="period" data-field="period"><option value="">Select period</option>${[1,2,3,4,5].map(p=>`<option value="${p}" ${String(state.period)===String(p)?'selected':''}>Period ${p}</option>`).join('')}</select></div></div><div class="notice" style="margin-top:18px">${icon('info')}<div><strong>About your responses</strong><br>Your work is saved only in this browser, not sent to a teacher or server. Download or print your answers when finished. Avoid using real classmates’ names in your examples. Clear your work before leaving a shared device.</div></div><div class="card-footer" style="margin:20px -28px -25px"><span class="small muted">About 25 minutes of independent work, followed by a class discussion.</span><button class="button primary" data-next>${state.startedAt?'Resume activity':'Begin activity'} ${icon('arrow')}</button></div></div>`;}
function recallPage(){return `${stageHead(1)}<div class="section-head"><span class="eyebrow">PART 1 · Remember the mission</span><h2>What do these offices reveal about Jesus?</h2><p>Through Baptism, Christians are called to share in Jesus’ priestly, prophetic, and kingly mission. Start with the Gospels. For each moment, choose the <strong>main office</strong> Jesus demonstrates. Notice that his offices can overlap.</p></div><div class="card reading-panel"><div class="scripture-grid">${RECALL.map((v,idx)=>{const chose=state.recall[v.id];const isCorrect=chose===v.role;return `<div class="scripture-card"><div class="scripture-upper"><div class="verse-label">${icon('book')} Scripture ${idx+1} · ${esc(v.ref)}</div><div class="verse-quote">${esc(v.quote)}</div></div><div class="scripture-foot"><strong>Which office is most visible?</strong>${['priest','prophet','king'].map(r=>`<button class="pill-option ${chose===r?'active':''}" aria-pressed="${chose===r}" data-match="${v.id}" data-role="${r}">${OFFICE_NAMES[r]}</button>`).join('')}</div>${chose?`<div class="verse-feedback ${isCorrect?'':'try'}">${isCorrect?`${icon('check')} Yes. ${esc(v.why)}`:`Not quite. Consider what Jesus does in this passage, then choose again.`}</div>`:''}</div>`}).join('')}</div><div class="lens-banner">${icon('lightbulb')}<div><strong>A helpful distinction:</strong> Priest = offering and intercession. Prophet = announcing truth. King = leading through self-giving service.</div></div></div>${navButtons(0,'Enter the first case','Try all three passages before moving on.')}`;}
function casePage(id){const c=CASES[id],picked=state.choice[id],revealed=state.revealed[id];return `${stageHead(STAGES.findIndex(s=>s.id===id))}<article class="card case-card ${id}"><div class="case-head ${id}"><div class="case-steps"><span>CASE ${c.num}</span><span>${c.role.toUpperCase()}</span><span>DECISION LAB</span></div><span class="eyebrow">${esc(c.tag)}</span><h2>${esc(c.title)}</h2><p>${esc(c.blurb)}</p></div><div class="case-inner"><div class="case-grid"><section class="story"><div class="story-number">01 / Read the situation</div><h3>The situation</h3>${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="chat-feed"><div class="chat-label">What appears on your phone</div>${c.chat.map((m,i)=>`<div class="message ${i%2?'out':''}"><strong>${esc(m.who)}</strong>${esc(m.text)}</div>`).join('')}</div>${revealed?`<div class="complication" id="complication"><span class="eyebrow">02 / Here is the complication</span><p>${esc(c.twist)}</p></div>`:`<button class="button soft reveal-btn" data-reveal="${id}">Reveal the complication ${icon('arrow')}</button>`}</section>
<aside class="lens"><div class="lens-icon">${icon(id)}</div><h3>Christ as ${c.role}</h3><p>${esc(OFFICE_BLURBS[id])}</p><div class="anchor-title">A Gospel anchor</div><p class="quote">${esc(c.verse)}</p><div class="ref">${esc(c.verseRef)} · NRSV-CE</div><div class="anchor-title">Another connection</div><p class="small">${esc(c.otherText)} <strong>${esc(c.otherRef)}</strong></p><div class="distinction">${esc(c.distinction)}</div></aside></div>
${revealed?`<section class="choice-section"><h3>03 / Your decision</h3><p>Choose the response you would defend <strong>at this moment</strong>. You may change your mind after seeing the possible consequences. There is no automatic grade.</p><div class="options">${c.choices.map((op,i)=>`<button class="option ${picked===i?'selected':''}" data-choice-case="${id}" data-choice-idx="${i}" aria-pressed="${picked===i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span><strong>${esc(op.title)}</strong><span class="desc">${esc(op.detail)}</span></span></button>`).join('')}</div>${Number.isInteger(picked)?`<div class="coach" role="status"><h4>${icon('lightbulb')} Consider the consequences of your choice</h4><div class="coach-grid"><div><strong>What this protects</strong><p>${esc(c.choices[picked].benefit)}</p></div><div><strong>What needs attention</strong><p>${esc(c.choices[picked].blind)}</p></div></div><div class="coaching-question"><strong>Ask yourself:</strong> ${esc(c.choices[picked].ask)}</div></div>`:''}</section><section class="reflection"><div class="reflect-head"><h3>04 / Explain your thinking</h3><p>Use one or two thoughtful sentences per answer.</p></div>${c.questions.map((q,i)=>questionHTML(`${id}_${i}`,q,i)).join('')}</section>`:`<div class="unfinished">${icon('info')} Reveal the complication to unlock your decision and written questions.</div>`}</div></article>${navButtons(0,'Next section','There is no single button that decides your mark.')}`;}
function questionHTML(key,q,i){const val=state.answers[key]||'';return `<div class="question"><div class="question-label">Question ${i+1} · ${esc(q.label)}</div><label for="ans-${key}">${esc(q.prompt)}</label><textarea id="ans-${key}" class="answer-input" rows="3" data-answer="${key}" maxlength="2500" placeholder="Write your reasoning here…">${esc(val)}</textarea><div class="answer-bottom"><details class="hint"><summary>Need a nudge?</summary><p>${esc(q.hint)}</p></details><span class="char-count" data-count="${key}">${val.trim().split(/\s+/).filter(Boolean).length} words</span></div></div>`;}
function integratePage(){return `${stageHead(5)}<div class="card"><div class="synthesis-intro"><span class="eyebrow" style="color:#c9e8da">PART 3 · Bring the three together</span><h2>One problem. Three ways to respond.</h2><p>Christ’s three offices belong to one mission. Apply all three to this final situation.</p></div><div class="synthesis-body"><div class="story"><div class="story-number">A new situation</div><h3>The care-kit project</h3><p>Your Grade 12 peer-mentoring group is collecting donations to make care kits for students who are having a difficult exam season. A rumour spreads that some donated money paid for committee sweatshirts. The student treasurer says that is false but has not yet shared the receipts, and is overwhelmed by angry messages.</p><p>You help lead the volunteers. Distribution is only three days away. People are upset, one volunteer wants to quit, and students who need the kits are counting on the project. You do not yet have every fact.</p></div><div class="three-actions">${[
{id:'prophet',title:'Prophet',desc:'What truth needs to be established and communicated fairly?',hint:'Think: check facts, communicate accurately, protect dignity.'},
{id:'priest',title:'Priest',desc:'How would you respond with prayer and self-giving care?',hint:'Think: intercede for people, support the stressed treasurer, and show up.'},
{id:'king',title:'King',desc:'What leadership action would protect the project and the people it serves?',hint:'Think: transparency, fair delegation, realistic planning, the common good.'}
].map(x=>`<div class="action-tile ${x.id}"><div class="office-icon">${icon(x.id)}</div><h3>${x.title}</h3><p>${x.desc}</p><label class="sr-only" for="final-${x.id}">${x.title}: ${x.desc}</label><textarea id="final-${x.id}" class="answer-input" data-final="${x.id}" maxlength="1600" placeholder="One realistic action…">${esc(state.final[x.id])}</textarea><details class="hint" style="margin-top:8px"><summary>Need a nudge?</summary><p>${x.hint}</p></details></div>`).join('')}</div><div class="reflection-box"><h3>Which office challenges you the most?</h3><p class="muted small">Choose one. There is no wrong answer, but your reason should connect to a genuine challenge teenagers face.</p><div class="pick-office" role="group" aria-label="Most challenging office">${['prophet','priest','king'].map(r=>`<button aria-pressed="${state.final.challenge===r}" class="${state.final.challenge===r?'selected':''}" data-challenge="${r}">${OFFICE_NAMES[r]}</button>`).join('')}</div><label for="final-why" class="small" style="display:block;margin-bottom:8px;font-weight:760">Why is this office difficult to live out? What would help a student practise it?</label><textarea id="final-why" class="answer-input" data-final="why" rows="3" maxlength="2200" placeholder="Explain the challenge and one way to grow…">${esc(state.final.why)}</textarea></div></div></div>${navButtons(0,'Prepare discussion','Your answer can recognize more than one office.')}`;}
function discussionText(){const c=CASES[state.discussionCase]||CASES.prophet;const chosen=state.choice[state.discussionCase];return `CASE: ${c.title}\nOFFICE: ${c.role}\nOUR DECISION: ${Number.isInteger(chosen)?c.choices[chosen].title:'Not selected'}\nHOW WE WOULD RESPOND: ${(state.answers[state.discussionCase+'_2']||'').trim()||'Not entered'}\nONE INSIGHT OR QUESTION: ${(state.discussionNote||'').trim()||'Not entered'}`;}
function readyPage(){const id=state.discussionCase,c=CASES[id],chose=state.choice[id];return `${stageHead(6)}<div class="completion-banner"><div class="checkmark">${icon('check','style="width:27px;height:27px"')}</div><div><strong>You have explored all three offices.</strong><p>Now select one response you can explain and defend during our class discussion.</p></div></div><section class="discussion-card card"><div class="discussion-card-head"><span class="eyebrow">PART 4 · Get ready to discuss</span><h2>Bring one idea to the room.</h2><p>Choose a case, prepare a specific point, and be ready to hear another perspective.</p></div><div class="discussion-body"><h3>Which case would you like to discuss?</h3><div class="select-case">${['prophet','priest','king'].map(r=>`<button class="${r===id?'selected':''}" data-discussion="${r}" aria-pressed="${r===id}">${icon(r)} ${OFFICE_NAMES[r]}</button>`).join('')}</div><div class="discussion-preview"><span class="eyebrow">Your discussion card</span><h3>${esc(c.title)}</h3><p><strong>Our response:</strong> ${chose!=null?esc(c.choices[chose].title):'Not selected'}</p><p><strong>Our reasoning / next move:</strong> ${esc(state.answers[id+'_2']||'Please finish the case response.')}</p><div class="q">You could be asked: <strong>What might someone reasonably disagree with in your plan?</strong></div></div><div class="question" style="margin:18px 0 0"><label for="discussion-note">Add one insight or question you would like to contribute. (One sentence.)</label><textarea id="discussion-note" class="answer-input" data-discussion-note rows="2" placeholder="A tension I noticed, a question to ask, or a challenge I would raise…">${esc(state.discussionNote)}</textarea><div class="answer-bottom"><details class="hint"><summary>Discussion prompt</summary><p>For example: “Is speaking publicly always better than speaking privately?” or “What if a good choice disappoints someone you care about?”</p></details></div></div><div class="output-bar"><button class="button primary" data-export="text">${icon('download')} Download answers (.txt)</button><button class="button secondary" data-export="print">${icon('print')} Print / save as PDF</button><button class="button soft" data-export="copy">${icon('copy')} Copy discussion card</button></div><div class="notice">${icon('info')} <div>Downloading or printing creates a copy for you. <strong>This app does not submit anything automatically.</strong> Follow your teacher’s directions for handing in work. Your group may discuss the fictional situations without sharing personal experiences.</div></div><div class="review-list"><details><summary>Review all of your written responses</summary>${['prophet','priest','king'].map(r=>{const cc=CASES[r];return `<h3 style="margin-top:15px">${esc(cc.title)}</h3>${cc.questions.map((q,i)=>`<p><strong>${esc(q.label)}:</strong> ${esc(state.answers[`${r}_${i}`]||'Not answered')}</p>`).join('')}`}).join('')}<h3 style="margin-top:15px">The care-kit project</h3>${['prophet','priest','king'].map(r=>`<p><strong>${OFFICE_NAMES[r]}:</strong> ${esc(state.final[r]||'Not answered')}</p>`).join('')}<p><strong>Hardest office:</strong> ${esc(OFFICE_NAMES[state.final.challenge]||'Not selected')}. ${esc(state.final.why||'')}</p></details></div><button class="button ghost" style="margin-top:13px" data-reset>${icon('refresh')} Clear saved work / start again</button><p class="ready-note" style="margin-top:12px">For a shared school computer, clear the saved responses before you leave, after exporting.</p></div></section><div class="nav-actions"><button class="button secondary" data-back>${icon('back')} Back to your answers</button><span class="nav-caption">Class conversation comes next.</span></div>`;}
function render(){const i=state.step;const body=i===0?startPage():i===1?recallPage():i===5?integratePage():i===6?readyPage():casePage(STAGES[i].id);app.innerHTML=navSide()+`<main class="main" id="main" tabindex="-1">${body}</main>`;document.getElementById('progress').style.width=`${Math.round((Math.max(0,i-0.25)/6)*100)}%`;tick();}
function statusFor(i){if(i===0)return '';
 if(i===1){const missing=RECALL.find(x=>!state.recall[x.id]);if(missing)return 'Match each Scripture passage to an office before continuing.';if(RECALL.find(x=>state.recall[x.id]!==x.role))return 'Revisit any highlighted Scripture matches before continuing.';return '';}
 if(i>=2&&i<=4){const id=STAGES[i].id;if(!state.revealed[id])return 'Reveal the complication before continuing.';if(!Number.isInteger(state.choice[id]))return 'Choose one response before continuing.';for(let k=0;k<3;k++)if((state.answers[`${id}_${k}`]||'').trim().length<8)return `Add a specific idea to question ${k+1} before continuing.`;return '';}
 if(i===5){for(const r of ['prophet','priest','king'])if((state.final[r]||'').trim().length<8)return `Add one concrete ${OFFICE_NAMES[r].toLowerCase()} action in the final case.`;if(!state.final.challenge)return 'Select which office you find most challenging.';if((state.final.why||'').trim().length<8)return 'Explain why this office is challenging before continuing.';return '';}
 return '';}
function goNext(){const error=statusFor(state.step);if(error){toast(error);let focus;if(state.step>=2&&state.step<=4){const id=STAGES[state.step].id;for(let k=0;k<3;k++){if((state.answers[id+'_'+k]||'').trim().length<8){focus=document.getElementById('ans-'+id+'_'+k);break;}}}if(focus)focus.focus();return;}if(state.step===0&&!state.startedAt)state.startedAt=Date.now();if(state.step<STAGES.length-1){state.step++;state.maxStep=Math.max(state.maxStep,state.step);save();render();window.scrollTo({top:0,behavior:'instant'});}}
function changeStep(i){if(i<0||i>state.maxStep||i>=STAGES.length)return;state.step=i;save();render();window.scrollTo({top:0,behavior:'instant'});}
function composeText(){const name=[state.name.trim(),state.mode==='pair'?state.partner.trim():''].filter(Boolean).join(' & ')||'Not provided';let t=`LIVING THE MISSION OF CHRIST\nHRE4M1 | Unit 1.7 | Priest, Prophet, King\n\nStudent(s): ${name}\nPeriod: ${state.period||'Not provided'}\nMode: ${state.mode==='pair'?'Pair':'Independent'}\n\n`;
 t+='SCRIPTURE WARM-UP\n'+RECALL.map(x=>`${x.ref}: ${OFFICE_NAMES[state.recall[x.id]]||'No answer'}`).join('\n')+'\n\n';for(const r of ['prophet','priest','king']){const c=CASES[r],selected=state.choice[r];t+=`${'='.repeat(53)}\nCASE ${c.num}: ${c.title} (${c.role})\nOur selected response: ${Number.isInteger(selected)?c.choices[selected].title:'Not selected'}\n\n`;c.questions.forEach((q,i)=>{t+=`Q${i+1}. ${q.prompt}\n${(state.answers[r+'_'+i]||'').trim()||'[No response]'}\n\n`});}
 t+=`${'='.repeat(53)}\nFINAL: THE CARE-KIT PROJECT\n`;for(const r of ['prophet','priest','king'])t+=`${OFFICE_NAMES[r]}: ${(state.final[r]||'').trim()||'[No response]'}\n\n`;t+=`Office I find most challenging: ${OFFICE_NAMES[state.final.challenge]||'Not selected'}\nWhy: ${(state.final.why||'').trim()||'[No response]'}\n\nCLASS DISCUSSION CARD\n${discussionText()}\n\n`;return t;}
function downloadText(){const contents=composeText();const blob=new Blob([contents],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');const base=(state.name.trim()||'Student').replace(/[^a-z0-9-]+/gi,'_').slice(0,40);link.download=`HRE4M1_Mission_of_Christ_${base}.txt`;link.href=url;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Your answer file is ready. Submit it according to your teacher’s instructions.');}
function printReport(){const h=[];h.push('<h1>Living the Mission of Christ</h1>');h.push(`<div class="print-meta">HRE4M1 · Unit 1.7 · Priest, Prophet, King<br><strong>Student(s):</strong> ${esc([state.name,state.mode==='pair'?state.partner:''].filter(Boolean).join(' & ')||'Not provided')} <strong>Period:</strong> ${esc(state.period||'Not provided')}</div>`);h.push('<h2>Scripture warm-up</h2>');RECALL.forEach(v=>h.push(`<p><strong>${v.ref}:</strong> ${esc(OFFICE_NAMES[state.recall[v.id]]||'Not answered')}</p>`));for(const r of ['prophet','priest','king']){const c=CASES[r],picked=state.choice[r];h.push(`<h2>Case ${c.num} · ${esc(c.title)} (${c.role})</h2><p><strong>Our decision:</strong> ${picked!=null?esc(c.choices[picked].title):'Not selected'}</p>`);c.questions.forEach((q,i)=>h.push(`<div class="print-section"><h3>${i+1}. ${esc(q.prompt)}</h3><p>${esc(state.answers[`${r}_${i}`]||'[No answer]')}</p></div>`));}h.push('<h2>Final scenario · The care-kit project</h2>');for(const r of ['prophet','priest','king'])h.push(`<p><strong>${OFFICE_NAMES[r]}:</strong> ${esc(state.final[r]||'[No answer]')}</p>`);h.push(`<p><strong>Hardest office:</strong> ${esc(OFFICE_NAMES[state.final.challenge]||'Not selected')}<br>${esc(state.final.why||'')}</p>`);h.push(`<h2>Class discussion</h2><p>${esc(discussionText()).replace(/\n/g,'<br>')}</p>`);const report=document.getElementById('print-report');report.innerHTML=h.join('');window.print();}
async function copyCard(){const text=discussionText();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Discussion card copied.');return;}}catch(_){}const temp=document.createElement('textarea');temp.value=text;temp.style.position='fixed';temp.style.opacity='0';document.body.append(temp);temp.select();let success=false;try{success=document.execCommand('copy');}catch(_){}temp.remove();toast(success?'Discussion card copied.':'Copy was blocked. Select and copy the card from the page instead.');}
app.addEventListener('click',(ev)=>{const btn=ev.target.closest('button');if(!btn||btn.disabled)return;
 if(btn.hasAttribute('data-next'))return goNext();if(btn.hasAttribute('data-back'))return changeStep(state.step-1);
 if(btn.hasAttribute('data-go'))return changeStep(Number(btn.dataset.go));
 if(btn.hasAttribute('data-mode')){state.mode=btn.dataset.mode;save();return render();}
 if(btn.hasAttribute('data-match')){state.recall[btn.dataset.match]=btn.dataset.role;save();return render();}
 if(btn.hasAttribute('data-reveal')){state.revealed[btn.dataset.reveal]=true;save();return render();}
 if(btn.hasAttribute('data-choice-case')){state.choice[btn.dataset.choiceCase]=Number(btn.dataset.choiceIdx);const y=window.scrollY;save();render();window.scrollTo(0,y);return;}
 if(btn.hasAttribute('data-challenge')){state.final.challenge=btn.dataset.challenge;save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
 if(btn.hasAttribute('data-discussion')){state.discussionCase=btn.dataset.discussion;save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
 if(btn.hasAttribute('data-export')){const kind=btn.dataset.export;if(kind==='text')return downloadText();if(kind==='print')return printReport();if(kind==='copy')return copyCard();}
 if(btn.hasAttribute('data-reset')){if(confirm('Clear all saved responses on this device and start again? Download your answers first if you want to keep a copy.')){state=initial();save();render();window.scrollTo(0,0);toast('Saved activity cleared.');}}
});
app.addEventListener('input',(ev)=>{const t=ev.target;if(t.hasAttribute('data-answer')){const key=t.dataset.answer;state.answers[key]=t.value;const count=app.querySelector(`[data-count="${key}"]`);if(count)count.textContent=`${t.value.trim().split(/\s+/).filter(Boolean).length} words`;}else if(t.hasAttribute('data-final')){state.final[t.dataset.final]=t.value;}else if(t.hasAttribute('data-field')){state[t.dataset.field]=t.value;}else if(t.hasAttribute('data-discussion-note')){state.discussionNote=t.value;}else return;save();});
app.addEventListener('change',(ev)=>{const t=ev.target;if(t.hasAttribute('data-field')){state[t.dataset.field]=t.value;save();}});
render();tick();setInterval(tick,1000);
</script>
</body>
</html>
