<script>
(()=>{'use strict';
const KEY='hre4m1_psalm22_casefiles_v1';
const sourceUrl=(ref)=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version=NRSVCE';
const caseFiles=[
{
 number:'01',tab:'The Cry',slug:'THE CRY',time:'4 min',name:'A cry that echoes',em:'echoes',sub:'A familiar sentence changes meaning when you read the whole poem.',
 evidence:[
  {kind:'psalm',source:'OLD TESTAMENT',ref:'Psalm 22:1',excerpt:'“My God, my God, why have you forsaken me?”',desc:'The psalm begins with intense suffering and the feeling of being abandoned.'},
  {kind:'gospel',source:'THE GOSPELS',ref:'Matthew 27:46; Mark 15:34',excerpt:'Jesus cries out the opening words of Psalm 22.',desc:'As He suffers on the cross, Jesus gives voice to real human anguish.'},
  {kind:'support',source:'ADDITIONAL CLUE',ref:'Psalm 22:22–24; Luke 23:46',excerpt:'The psalm later moves toward praise. Jesus also entrusts His spirit to the Father.',desc:'What do these later words contribute to the meaning of His cry?'}
 ],
 notice:'What should you do before deciding Jesus has completely lost trust in God?',
 choices:['Read only the first line of Psalm 22.','Read how the rest of Psalm 22 develops.','Assume Jesus did not experience real suffering.'],correct:1,
 right:'Exactly. The larger context can change how a single line is understood.',wrong:'Try again. What might be missing when we interpret only one sentence?',
 question:'How does Psalm 22:1 help us understand Jesus’ suffering on the cross? What does this tell us about His trust in God despite His suffering?',
 steps:['Describe what Jesus’ cry reveals about His suffering.','Look at how Psalm 22 develops, especially verses 22–24.','Explain how pain and trust in the Father can exist together.'],
 hints:['Re-read the opening line. What human emotion do you hear?','Now look at Psalm 22:22–24 and Luke 23:46. Does the story end with the feeling expressed in verse 1?']
},
{

  {kind:'gospel',source:'THE GOSPELS',ref:'Matthew 27:39–43',excerpt:'The onlookers mock Jesus and challenge Him to save Himself.',desc:'They see His remaining on the cross as evidence against His claim to be the Messiah.'}
 ],
 notice:'What assumption is behind the mockers’ words in both passages?',
 choices:['A true saviour should visibly escape humiliation and suffering.','The Messiah’s mission involves reaching all nations.','A faithful person should always keep silent.'],correct:0,
 right:'Good observation. Now ask how Jesus’ self-giving love challenges that assumption.',wrong:'Look again at what the crowd demands. What would convince them that Jesus has power?',
 question:'Compare Psalm 22:7–8 with Matthew 27:39–43. How does the mockery Jesus received on the cross echo the psalm? What does it reveal about how people misunderstood His mission?',

},
{

  {kind:'psalm',source:'OLD TESTAMENT',ref:'Psalm 22:16',excerpt:'“My hands and feet have shriveled.”',desc:'This is the wording of the NRSV-CE. Some other translations use “they have pierced my hands and feet.” The Hebrew phrase is uncertain.'},
  {kind:'gospel',source:'THE GOSPELS',ref:'John 19:18; John 20:25–27',excerpt:'Jesus is crucified; the risen Jesus bears the marks of nails.',desc:'Thomas asks to examine the marks. Jesus later invites him to do so, although John does not say that Thomas actually touches them.'},
  {kind:'support',source:'ONE MORE PARALLEL',ref:'Psalm 22:18; John 19:23–24',excerpt:'Clothing is divided, and lots are cast.',desc:'Compare this additional detail in the psalm with John’s crucifixion account.'}
 ],
 notice:'Which statement shows the most careful reading of the evidence?',
 choices:['Every Bible translation uses precisely the same words.','John explicitly says Thomas touches Jesus’ wounds.','Psalm 22:16 has translation differences; Christians read it alongside the Gospel accounts.'],correct:2,
 right:'Good scholarship. You can make a meaningful Christian connection while recognizing translation uncertainty.',wrong:'Check the translation note and what John says Thomas asked to do versus what John records him doing.',
 question:'Some translations of Psalm 22:16 describe pierced hands and feet. Compare this verse with John 19:18 and John 20:25–27. How do Christians connect this earlier psalm with Jesus’ crucifixion, and why is that connection significant?',
 steps:['Describe the imagery of suffering in Psalm 22 and the wounds mentioned in John.','Explain the connection Christians see between the earlier text and Jesus.','Acknowledge that the wording of Psalm 22:16 varies between translations.'],
 hints:['Look closely at John 20:25. What proof does Thomas ask for?','How might Christians understand earlier Scripture more deeply in light of Jesus’ Passion, while still reading the wording accurately?'],
 caveat:'Translation detective: The NRSV-CE has “My hands and feet have shriveled” and notes that the Hebrew is uncertain. Some Christian translations read “they have pierced my hands and feet.” Do not claim that all translations agree, or that crucifixion was invented by the Romans.'
},
{
 number:'04',tab:'The Turn',slug:'THE TURN',time:'4 min',name:'The turning point',em:'turning point',sub:'Psalm 22 does not end where it begins. Neither does the Gospel story.',
 evidence:[
  {kind:'psalm',source:'OLD TESTAMENT',ref:'Psalm 22:1, 22–24',excerpt:'The poem moves from a cry of distress to a declaration of praise.',desc:'The speaker tells others about God and affirms that God has heard the suffering one.'},
  {kind:'gospel',source:'THE GOSPELS',ref:'Luke 23:46; John 20:25–27',excerpt:'Jesus entrusts Himself to the Father; afterward the risen Jesus appears.',desc:'The Passion and death of Jesus are not the final chapter of the Paschal Mystery.'}
 ],
 notice:'Which two-part pattern best captures the movement of Psalm 22?',
 choices:['Praise and celebration → isolation and fear','Lament and suffering → trust and praise','Resurrection → the Last Supper'],correct:1,
 right:'That movement is key. Explain how Christians see it illuminated by Christ’s Resurrection.',wrong:'Find the contrast between verse 1 and verses 22–24. What changes?',
 question:'Psalm 22 moves from suffering to hope in verses 22–24. How does this transition mirror the shift from Jesus’ Passion to His Resurrection? How does it illuminate the Christian belief in redemption?',
 steps:['Name the mood at the beginning and near the end of the psalm.','Connect that shift with Jesus’ Passion, death, and Resurrection.','Explain why the Resurrection, not suffering by itself, is central to Christian hope.'],
 hints:['Think about the difference between the opening cry and the later praise of God.','Christian faith does not say every difficulty ends quickly or happily. What is unique about Christ’s victory over death?']
},
{
 number:'05',tab:'All Nations',slug:'ALL NATIONS',time:'4 min',name:'A message for the world',em:'world',sub:'The hope at the end of the psalm reaches far beyond one person.',
 evidence:[
  {kind:'psalm',source:'OLD TESTAMENT',ref:'Psalm 22:27–28',excerpt:'“All the ends of the earth” turn to the Lord.',desc:'The conclusion imagines the families of the nations worshipping God.'},
  {kind:'gospel',source:'THE GOSPELS',ref:'Matthew 28:19–20',excerpt:'“Go therefore and make disciples of all nations.”',desc:'The risen Jesus sends His disciples beyond their immediate community and promises to be with them.'}
 ],
 notice:'Who is included in the scope of this mission?',
 choices:['Only those who witnessed the crucifixion','Every nation and people, not just one group','Only the first twelve apostles'],correct:1,
 right:'Yes. Now explain what makes that mission universal and what the disciples are asked to do.',wrong:'Find the words that describe the range of people in Psalm 22 and Matthew 28.',
 question:'Psalm 22:27–28 speaks of “all the ends of the earth” turning to God. How does this connect to the Great Commission in Matthew 28:19–20? What does it teach us about the universal mission of salvation?',
 steps:['Identify the phrase showing the wide reach of Psalm 22.','Explain what Jesus tells the disciples to do after His Resurrection.','Connect both to the Christian belief that the Gospel is offered to every nation.'],
 hints:['Underline the idea that appears in both passages: “all the ends of the earth” and “all nations.”','The psalm describes a vision. Matthew records a mission. What is the connection between the two?']
}
];
const stages=[{tab:'The Brief'},...caseFiles.map(x=>({tab:x.tab})),{tab:'Take-Up Sheet'}];
const fresh=()=>({name1:'',name2:'',period:'',answers:['','','','',''],picks:{},hints:{},warmup:[],followup:'',elapsed:0,started:false,current:0});
let state=fresh();
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&typeof old==='object'){state={...fresh(),...old};if(!Array.isArray(state.answers)||state.answers.length!==5)state.answers=['','','','',''];if(!Array.isArray(state.warmup))state.warmup=[];}}catch(e){}
let current=Math.max(0,Math.min(6,Number(state.current)||0)),running=false,lastTick=0,timerInterval=null,toastTimer=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const wordCount=text=>String(text||'').trim().split(/\s+/).filter(Boolean).length;
const doneCount=()=>state.answers.filter(a=>wordCount(a)>=17).length;
const save=()=>{state.current=current;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const toast=t=>{const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100)};
function updateHeader(){const n=doneCount();$('progressText').textContent=n+' / 5';$('progressFill').style.width=n*20+'%';const remaining=Math.max(0,1500-state.elapsed);$('timerText').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('timerButton').textContent=running?'Ⅱ':'▶';$('timerButton').setAttribute('aria-label',running?'Pause activity timer':'Start activity timer');$('timerButton').title=running?'Pause activity timer':'Start activity timer';}
function syncClock(){if(!running)return;const now=Date.now(),delta=Math.floor((now-lastTick)/1000);if(delta>=1){state.elapsed=Math.min(1500,state.elapsed+delta);lastTick+=delta*1000;if(state.elapsed>=1500){pauseTimer(true);toast('25 minutes reached. Finish your current thought and get ready for class discussion.')}else if(state.elapsed%10===0){save()}updateHeader();}}
function startTimer(){if(running||state.elapsed>=1500)return;running=true;state.started=true;lastTick=Date.now();timerInterval=setInterval(syncClock,750);updateHeader();save();}
function pauseTimer(expired=false){if(running&&!expired)syncClock();running=false;clearInterval(timerInterval);timerInterval=null;updateHeader();save();}
function nav(){const wrap=$('stageNav');wrap.innerHTML=stages.map((s,i)=>`<button type="button" class="stage-tab ${i===current?'active':''}" data-go="${i}" ${i===current?'aria-current="step"':''}><span class="number">${String(i).padStart(2,'0')}</span>${esc(s.tab)}${i>0&&i<=5&&wordCount(state.answers[i-1])>=17?'<span class="check" aria-label="Response drafted">●</span>':''}</button>`).join('');const selected=wrap.querySelector('.active');if(selected)selected.scrollIntoView({block:'nearest',inline:'nearest'});}
function heroSvg(){return `<div class="intro-orbit" aria-hidden="true"><div class="orbit-small">XXII</div></div>`}
function intro(){const options=['Ascension','Death','Passion','Resurrection'];const names={Passion:'Passion',Death:'Death',Resurrection:'Resurrection',Ascension:'Ascension'};const filled=state.warmup.map((s,i)=>`<span class="slot">${esc(names[s])}</span>${i<3?'<span class="sequence-arrow">→</span>':''}`).join('');const remaining=4-state.warmup.length;const slots=Array.from({length:remaining},(_,i)=>`<span class="slot">${state.warmup.length+i+1}</span>${i<remaining-1?'<span class="sequence-arrow">→</span>':''}`).join('');const complete=state.warmup.length===4;const correct=complete&&state.warmup.join('|')==='Passion|Death|Resurrection|Ascension';
return `<div class="intro-layout"><section class="intro-hero" aria-label="Investigation introduction">${heroSvg()}<div><div class="intro-super"><span class="intro-line"></span>A 25-minute scripture investigation</div><h1 class="intro-title">Five clues.<br>One <em>mystery.</em></h1><p class="intro-copy">Hundreds of years before the Gospels, Psalm 22 told a story that moved from anguish to hope. Why did Jesus speak its opening words from the cross?</p></div><div class="intro-foot"><span class="tag">✦ Five case files</span><span class="tag">◇ Your own conclusions</span><span class="tag">◷ 25 minutes</span></div></section>
<div class="intro-right"><section class="panel start-card"><div class="kicker">YOUR MISSION</div><h2>Follow the evidence.</h2><p>Work on your own or with a partner. Read the short Scripture clues, try each mini-challenge, then write a thoughtful response to the question. We will compare answers as a class.</p>
<div class="field-row"><div class="form-field"><label for="name1">Your first name (optional)</label><input id="name1" type="text" autocomplete="off" maxlength="60" placeholder="Student 1" value="${esc(state.name1)}"></div><div class="form-field"><label for="name2">Partner (optional)</label><input id="name2" type="text" autocomplete="off" maxlength="60" placeholder="Student 2" value="${esc(state.name2)}"></div></div>
<div class="form-field"><label for="period">Class period (optional)</label><select id="period"><option value="">Select your period</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${state.period===String(i)?'selected':''}>Period ${i}</option>`).join('')}</select></div>
<button type="button" class="btn btn-primary btn-full" id="begin">Begin the investigation <span aria-hidden="true">→</span></button><p class="mini-note">Your typing automatically saves in this browser. Nothing is submitted online. At the end, use the Take-Up Sheet to view or export your answers.</p></section>
<section class="panel warmup-card"><div class="kicker">30-SECOND WARM-UP</div><h3 class="warmup-title">Put the Paschal Mystery in order.</h3><p class="warmup-desc">Tap the four moments in the order we studied them.</p><div class="sequence-picks" aria-label="Tap the moments in order">${options.map(o=>`<button type="button" data-moment="${o}" ${state.warmup.includes(o)?'disabled':''}>${o}</button>`).join('')}</div><div class="sequence-result" aria-label="Your selected order" style="margin-top:13px">${filled}${filled&&remaining?'<span class="sequence-arrow">→</span>':''}${slots}</div><div class="sequence-feedback" aria-live="polite">${complete?(correct?'✓ Correct sequence. You are ready.':'Not quite. Check the sequence you learned in the lesson.'):'Start with the suffering and Passion of Jesus.'}</div><button type="button" class="btn btn-text" id="resetSequence" style="min-height:24px;padding:3px 0;font-size:12px">↻ Reset sequence</button></section></div></div>`}
function evidenceCard(ev){const supporting=ev.kind==='support'?'support':ev.kind==='gospel'?'gospel':'';return `<div class="evidence-card ${supporting}"><div class="stripe"></div><div><div class="evidence-top"><small>${esc(ev.source)}</small><strong class="evidence-ref">${esc(ev.ref)}</strong></div><div class="evidence-excerpt">${esc(ev.excerpt)}</div><p class="evidence-desc">${esc(ev.desc)}</p><a class="scripture-link" href="${sourceUrl(ev.ref)}" target="_blank" rel="noopener noreferrer">Read passage (NRSV-CE) ↗</a></div></div>`}
function casePage(index){const d=caseFiles[index],picked=state.picks[index],hintN=Math.min(2,Math.max(0,state.hints[index]||0)),wc=wordCount(state.answers[index]),done=wc>=17;
const choices=d.choices.map((x,i)=>`<button type="button" class="option ${picked===i?'selected':''}" data-pick="${i}" data-case="${index}" aria-pressed="${picked===i?'true':'false'}"><span class="option-dot">${picked===i?'✓':String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');
return `<div class="section-top"><div><div class="kicker">CASE FILE ${d.number} / 05 · ${d.time} suggested</div><h1 class="serif">${esc(d.name)}</h1><p>${esc(d.sub)}</p></div><div class="case-num-box"><span>✦</span> Scripture investigation <strong>${d.number}/05</strong></div></div>
<div class="case-grid"><div class="evidence-column"><section class="panel evidence-area"><div class="box-head"><strong>① Read the clues</strong><span>Look for a connection</span></div>${d.evidence.map(evidenceCard).join('')}<div class="reading-prompt"><span class="spark" aria-hidden="true">✧</span><div><strong>Reading tip:</strong> Compare the language and the larger context of the psalm and the Gospel. You can also open the complete passages in the NRSV-CE above.</div></div>${d.caveat?`<div class="caution"><strong>Important text note:</strong> ${esc(d.caveat)}</div>`:''}</section>
<section class="micro" aria-label="Quick evidence check"><small>② Stop &amp; notice</small><h3>${esc(d.notice)}</h3><div class="micro-options">${choices}</div><div class="micro-feedback ${picked===d.correct?'right':''}" ${picked===undefined?'hidden':''} id="microFeedback" role="status">${picked===undefined?'':esc(picked===d.correct?d.right:d.wrong)}</div></section></div>
<div class="answer-column"><section class="panel answer-panel"><div class="answer-topline"><small>③ Make your case</small><span class="answer-status"><span id="answerDot" class="status-dot ${done?'done':''}"></span><span id="draftStatus">${done?'Draft ready':'Your own words'}</span></span></div><h2 class="question-title">${esc(d.question)}</h2><div class="scaffold"><div class="scaffold-header">Build your answer</div><ol class="scaffold-steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="answer-label"><label for="caseAnswer"><strong>Your response</strong></label><span>Aim for 2–4 clear sentences</span></div><textarea id="caseAnswer" class="answer-area" spellcheck="true" placeholder="Use the evidence from Scripture, then explain what it means in your own words.">${esc(state.answers[index])}</textarea><div class="answer-foot"><span id="wordCount" class="word-count ${done?'ready':''}">${wc} words ${done?' · drafted':''}</span><span>Auto-saved locally</span></div><div class="bottom-actions"><button class="btn btn-muted" data-go="${index===0?0:index}">← Back</button><button class="btn btn-teal" data-go="${index===4?6:index+2}">${index===4?'Prepare Take-Up Sheet':'Next case file →'}</button></div><div class="save-label"><span aria-hidden="true">✓</span> No score. No automatic marking. We will discuss the responses together.</div></section><section class="panel hint-card"><div class="hint-header"><strong>Need a nudge?</strong><button type="button" data-hint="${index}" ${hintN>=2?'disabled':''}>${hintN===0?'Reveal hint 1':hintN===1?'Reveal hint 2':'All hints revealed'}</button></div>${hintN>0?`<p class="hint-text"><strong>Hint 1:</strong> ${esc(d.hints[0])}</p>`:''}${hintN>1?`<p class="hint-text"><strong>Hint 2:</strong> ${esc(d.hints[1])}</p>`:''}</section></div></div>`}
function studentMeta(){const names=[state.name1.trim(),state.name2.trim()].filter(Boolean).join(' & ')||'Student(s)';return `${names}${state.period?' | Period '+state.period:''}`}
function review(){const n=doneCount();const cards=caseFiles.map((d,i)=>`<section class="panel review-item"><div class="review-meta"><small>Question ${i+1} · ${esc(d.tab)}</small><button type="button" data-go="${i+1}">Edit response ↗</button></div><p class="review-q">${esc(d.question)}</p><p class="review-response ${wordCount(state.answers[i])?'':'empty'}">${esc(state.answers[i]||'No response written yet. You can return to this case file and add your ideas.')}</p></section>`).join('');
return `<div class="student-print-head"><h1>Psalm 22 · The Paschal Mystery</h1><p>HRE4M1, Unit 1.5 · ${esc(studentMeta())} · Student discussion responses</p></div><section class="review-head"><div class="kicker">CLASS DISCUSSION / YOUR NOTES</div><h1>Your take-up sheet.</h1><p>You drafted ${n} of 5 responses. Keep these handy during our class take-up. Listen for different ways to use the passages and improve your thinking.</p><div class="review-tools"><button class="btn btn-primary" type="button" id="downloadAnswers">↓ Download answers (.txt)</button><button class="btn btn-muted" type="button" id="printAnswers">▣ Print / Save as PDF</button><button class="btn btn-muted" type="button" id="copyAnswers">▤ Copy all answers</button></div></section><div class="review-layout"><div class="review-list">${cards}</div><aside class="panel review-side"><div class="kicker">BEFORE WE DISCUSS</div><h3>Ready to share?</h3><ul><li>Choose one answer you can explain using a specific verse.</li><li>Be prepared to explain a connection, not just repeat a quotation.</li><li>Listen for an idea you missed or want to clarify.</li></ul><label for="followup">A question or idea I want to raise in class (optional)</label><textarea id="followup" placeholder="One idea I'm curious about is…">${esc(state.followup)}</textarea><p class="mini-note">Remember: a good interpretation considers both what the text says and its wider context.</p><button class="btn btn-muted btn-full" type="button" data-go="1">← Review the case files</button></aside></div>`}
function render(){nav();$('stageArea').innerHTML=current===0?intro():current===6?review():casePage(current-1);updateHeader();save();}
function go(to){const v=Number(to);if(!Number.isInteger(v)||v<0||v>6)return;current=v;render();window.scrollTo({top:0,behavior:'instant'});}
function allText(){let out='THE PASCHAL MYSTERY AND PSALM 22\nHRE4M1 · UNIT 1.5 · CLASS DISCUSSION NOTES\n';out+='Student(s): '+studentMeta()+'\n\n';caseFiles.forEach((d,i)=>{out+=`QUESTION ${i+1}: ${d.tab.toUpperCase()}\n${d.question}\n\n${state.answers[i].trim()||'[No response entered]'}\n\n`;});if(state.followup.trim())out+='QUESTION FOR CLASS DISCUSSION\n'+state.followup.trim()+'\n';out+='\nResponses prepared for in-class discussion. No automatic grading.\n';return out;}
function download(){const blob=new Blob([allText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');const name=(state.name1||'student').replace(/[^a-z0-9_-]/gi,'_').slice(0,30);link.href=url;link.download=`Psalm22_CaseFiles_${name}.txt`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Your answers were saved as a text file.');}
async function copy(){const t=allText();try{await navigator.clipboard.writeText(t);toast('Answers copied.')}catch(e){const temp=document.createElement('textarea');temp.value=t;temp.style.position='fixed';temp.style.opacity='0';document.body.appendChild(temp);temp.focus();temp.select();let yes=false;try{yes=document.execCommand('copy')}catch(e){}temp.remove();toast(yes?'Answers copied.':'Clipboard not available here. Use Download answers instead.');}}
function handleChoice(button){const i=Number(button.dataset.case),choice=Number(button.dataset.pick);state.picks[i]=choice;save();document.querySelectorAll('.option').forEach(b=>{const selected=Number(b.dataset.pick)===choice;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected?'true':'false');const dot=b.querySelector('.option-dot');dot.textContent=selected?'✓':String.fromCharCode(65+Number(b.dataset.pick));});const fb=$('microFeedback');fb.hidden=false;fb.classList.toggle('right',choice===caseFiles[i].correct);fb.textContent=choice===caseFiles[i].correct?caseFiles[i].right:caseFiles[i].wrong;}
function updateAnswer(el){const i=current-1;if(i<0||i>4)return;state.answers[i]=el.value;const wc=wordCount(el.value),done=wc>=17;$('wordCount').textContent=wc+' words'+(done?' · drafted':'');$('wordCount').classList.toggle('ready',done);$('answerDot').classList.toggle('done',done);$('draftStatus').textContent=done?'Draft ready':'Your own words';updateHeader();nav();save();}
function selectMoment(moment){if(state.warmup.includes(moment)||state.warmup.length>=4)return;state.warmup.push(moment);save();render();}
$('timerButton').addEventListener('click',()=>running?pauseTimer():startTimer());
$('clearButton').addEventListener('click',()=>{if(confirm('Clear all five responses, names, and activity progress stored in this browser? This cannot be undone.')){pauseTimer();state=fresh();current=0;try{localStorage.removeItem(KEY)}catch(e){}render();toast('Local activity data cleared.')}});
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;
 if(target.hasAttribute('data-go')){go(target.dataset.go);return;}
 if(target.id==='begin'){if(!state.started)startTimer();go(1);return;}
 if(target.hasAttribute('data-pick')){handleChoice(target);return;}
 if(target.hasAttribute('data-hint')){const i=Number(target.dataset.hint);state.hints[i]=Math.min(2,(Number(state.hints[i])||0)+1);render();return;}
 if(target.hasAttribute('data-moment')){selectMoment(target.dataset.moment);return;}
 if(target.id==='resetSequence'){state.warmup=[];render();return;}
 if(target.id==='downloadAnswers'){download();return;}
 if(target.id==='printAnswers'){window.print();return;}
 if(target.id==='copyAnswers'){copy();return;}
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='caseAnswer'){updateAnswer(el);return;}if(el.id==='name1'){state.name1=el.value;save();return;}if(el.id==='name2'){state.name2=el.value;save();return;}if(el.id==='followup'){state.followup=el.value;save();return;}});
document.addEventListener('change',event=>{if(event.target.id==='period'){state.period=event.target.value;save();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncClock()});
window.addEventListener('beforeunload',()=>{syncClock();save();});
render();
})();
